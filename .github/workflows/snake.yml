name: Generate Profile Graphs

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Collect graphs into output
        run: |
          mkdir -p public
          cp dist/*.svg public/
          src=$(find . -type d -name profile-3d-contrib -not -path './public/*' | head -1)
          if [ -z "$src" ]; then echo "::error::profile-3d-contrib not found: $(ls -A | tr '\n' ' ')"; exit 1; fi
          cp -r "$src" public/profile-3d-contrib
          echo "::notice::published $(cd public && find . -name '*.svg' | sort | tr '\n' ' ')"

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
